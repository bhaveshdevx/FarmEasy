<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="500" height="500">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />   <stop offset="50%" stop-color="#ff5555" />  <stop offset="100%" stop-color="#ff2a88" /> </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#181820" />
  
  <path d="M 70 160 
           L 70 125 
           L 60 133 
           L 100 98 
           L 115 111 
           L 115 100 
           L 125 100 
           L 125 120 
           L 140 133 
           L 130 125 
           L 130 160 
           C 160 175, 185 140, 165 100 
           C 150 70, 135 40, 110 20 
           C 95 35, 95 55, 105 75 
           C 80 65, 50 60, 45 95 
           C 30 135, 45 170, 70 160 
           Z" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>
</svg>